spring:
  profiles:
    active: local

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: false

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            authorization-grant-type: authorization_code
            scope: profile_nickname, profile_image
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/google"
            scope: profile, email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

jwt:
  secret: ${JWT_SECRET}
  access-expiration: 3600       # 1시간 (초)
  refresh-expiration: 1209600   # 14일 (초)

aws:
  s3:
    bucket: ${AWS_S3_BUCKET:pagemate-dev}
    region: ${AWS_REGION:ap-northeast-2}
  access-key: ${AWS_ACCESS_KEY:}
  secret-key: ${AWS_SECRET_KEY:}

kakao:
  api-key: ${KAKAO_REST_API_KEY}
  book-search-url: https://dapi.kakao.com/v3/search/book

oauth:
  kakao:
    redirect-uri: ${KAKAO_REDIRECT_URI}
  google:
    redirect-uri: ${GOOGLE_REDIRECT_URI}
    android-client-id: ${GOOGLE_ANDROID_CLIENT_ID}
    ios-client-id: ${GOOGLE_IOS_CLIENT_ID}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs
