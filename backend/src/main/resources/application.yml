spring:
  profiles:
    active: local

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: false

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            authorization-grant-type: authorization_code
            scope: profile_nickname, profile_image
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/google"
            scope: profile, email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

jwt:
  secret: ${JWT_SECRET}
  access-expiration: 3600       # 1시간 (초)
  refresh-expiration: 1209600   # 14일 (초)

# 이미지 저장소: Cloudinary. CLOUDINARY_URL 미설정 시 업로드 비활성(null 반환)
cloudinary:
  url: ${CLOUDINARY_URL:}

kakao:
  api-key: ${KAKAO_REST_API_KEY}
  book-search-url: https://dapi.kakao.com/v3/search/book
  local-search-url: https://dapi.kakao.com/v2/local/search/address.json
  reverse-geocode-url: https://dapi.kakao.com/v2/local/geo/coord2address.json

oauth:
  kakao:
    redirect-uri: ${KAKAO_REDIRECT_URI}
  google:
    redirect-uri: ${GOOGLE_REDIRECT_URI}
    android-client-id: ${GOOGLE_ANDROID_CLIENT_ID}
    ios-client-id: ${GOOGLE_IOS_CLIENT_ID}

# App Store 심사관용 체험 로그인. 공개 엔드포인트이므로 심사 기간에만 켜고,
# 심사용 데모 로그인. 데모 키는 앱 빌드에도 포함돼 비밀이 아니므로 파일에 기본값으로 둔다.
# 심사 통과 후 enabled 를 false 로 바꾸거나 DEMO_LOGIN_ENABLED=false 로 즉시 닫는다.
demo:
  login:
    enabled: ${DEMO_LOGIN_ENABLED:true}
    key: ${DEMO_LOGIN_KEY:Vh5Ks2Q-CNeNYHLZnjlqsletbmgeuSji}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs
